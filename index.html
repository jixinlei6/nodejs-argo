<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIXINLEI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a2e;
            font-family: system-ui, sans-serif;
        }
        .text {
            font-size: 64px;
            color: #4cc9f0;
            font-weight: bold;
            letter-spacing: 8px;
            transition: transform 0.4s ease, color 0.4s ease, text-shadow 0.4s ease;
            cursor: default;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="text">JIXINLEI</div>

    <script>
        const el = document.querySelector('.text');
        // 备选霓虹颜色组
        const colorList = [
            '#f72585',
            '#4361ee',
            '#4cc9f0',
            '#72efdd',
            '#ffbe0b',
            '#fb5607',
            '#8338ec',
            '#06ffa5'
        ];

        el.addEventListener('mouseenter', () => {
            // 随机形变参数
            const rotate = (Math.random() * 10 - 5);
            const scale = 1.1 + Math.random() * 0.3;
            const offsetX = Math.random() * 8 - 4;
            const offsetY = Math.random() * 8 - 4;

            // 随机选取颜色
            const randomColor = colorList[Math.floor(Math.random() * colorList.length)];
            // 搭配辅助发光色
            const glowColor = colorList[Math.floor(Math.random() * colorList.length)];

            el.style.transform = `scale(${scale}) rotate(${rotate}deg) translate(${offsetX}px, ${offsetY}px)`;
            el.style.color = randomColor;
            el.style.textShadow = `0 0 15px ${randomColor}, 0 0 30px ${glowColor}`;
        });

        el.addEventListener('mouseleave', () => {
            el.style.transform = '';
            el.style.color = '';
            el.style.textShadow = '';
        });
    </script>
</body>
</html>
